catalog_version: "1.1.0"
description: Data quality rules for implemented synthetic Atlas Industrial source datasets.
rules:
  - id: DQ-CORE-001
    domain: cross_domain
    description: A field declared as required must contain a non-empty value.
    severity: error
    disposition: quarantine

  - id: DQ-CORE-002
    domain: cross_domain
    description: A non-empty source value must be parseable as its declared type.
    severity: error
    disposition: quarantine

  - id: DQ-CORE-003
    domain: cross_domain
    description: A value governed by a contract enumeration must belong to that enumeration after documented normalization.
    severity: error
    disposition: quarantine

  - id: DQ-CORE-004
    domain: cross_domain
    description: A required reference must resolve to an accepted conformed parent record.
    severity: error
    disposition: quarantine

  - id: DQ-CORE-005
    domain: cross_domain
    description: A business key must identify at most one accepted record in a Silver input or target table.
    severity: error
    disposition: quarantine

  - id: DQ-CORE-006
    domain: cross_domain
    description: An interval end timestamp must be later than its start timestamp.
    severity: error
    disposition: quarantine

  - id: DQ-CORE-007
    domain: cross_domain
    description: A numeric value must remain within the minimum and relational bounds declared by its contract.
    severity: error
    disposition: quarantine

  - id: DQ-PROD-001
    domain: production
    description: Production quantity must be greater than or equal to zero.
    severity: error
    disposition: quarantine

  - id: DQ-QUAL-001
    domain: quality
    description: Every quality inspection must have a non-empty inspection identifier.
    severity: error
    disposition: quarantine

  - id: DQ-MAINT-001
    domain: maintenance
    description: A maintenance completion timestamp cannot precede its start timestamp.
    severity: error
    disposition: quarantine
  - id: DQ-PROD-002
    domain: production
    description: Production event identifiers must use the documented PEV format.
    severity: error
    disposition: quarantine
  - id: DQ-PROD-003
    domain: production
    description: Production events must reference an existing machine.
    severity: error
    disposition: quarantine
  - id: DQ-PROD-004
    domain: production
    description: Production events must reference an existing production order.
    severity: error
    disposition: quarantine
  - id: DQ-PROD-005
    domain: production
    description: Production event status must be completed.
    severity: error
    disposition: quarantine
  - id: DQ-PROD-006
    domain: production
    description: Production event identifiers must be unique within a source file.
    severity: error
    disposition: quarantine
  - id: DQ-QUAL-002
    domain: quality
    description: Quality inspection status must be PASS or FAIL after case-normalization handling.
    severity: error
    disposition: quarantine
  - id: DQ-QUAL-003
    domain: quality
    description: Defective quantity cannot exceed inspected quantity.
    severity: error
    disposition: quarantine
  - id: DQ-QUAL-004
    domain: quality
    description: Case-equivalent PASS or FAIL values must be normalized without quarantine.
    severity: warning
    disposition: observe
  - id: DQ-QUAL-005
    domain: quality
    description: Quality inspection identifiers must be unique.
    severity: error
    disposition: quarantine
  - id: DQ-MAINT-002
    domain: maintenance
    description: Maintenance events must reference an existing machine.
    severity: error
    disposition: quarantine
  - id: DQ-MAINT-003
    domain: maintenance
    description: Reported maintenance downtime cannot be negative.
    severity: error
    disposition: quarantine
  - id: DQ-MAINT-004
    domain: maintenance
    description: Completed corrective work orders require a failure classification.
    severity: error
    disposition: quarantine
